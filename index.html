<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHY 103 — Properties of Matter | MCQ Test</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1F44;
    --gold: #C9A84C;
    --gold-light: #e8c870;
    --bg: #05101f;
    --surface: #0d2040;
    --surface2: #112650;
    --text: #d8e8ff;
    --text-muted: #7a9abf;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --correct-bg: rgba(46,204,113,0.12);
    --wrong-bg: rgba(231,76,60,0.12);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, #071830 100%);
    border-bottom: 2px solid var(--gold);
    padding: 28px 24px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  header h1 {
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 800;
    color: var(--gold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header p {
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    margin-top: 4px;
  }

  /* ── PROGRESS BAR ── */
  #progress-wrap {
    background: var(--surface);
    height: 6px;
    border-radius: 3px;
    margin: 14px auto 0;
    max-width: 500px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.4s ease;
    border-radius: 3px;
  }
  #progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
  }

  /* ── LAYOUT ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 30px 16px 20px;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .controls select, .controls button {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    padding: 9px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--gold);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .controls button:hover, .controls select:hover {
    background: var(--gold);
    color: var(--navy);
  }
  .controls button.primary {
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    border-color: var(--gold);
  }
  .controls button.primary:hover {
    background: var(--gold-light);
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 18px;
    transition: border-color 0.3s;
    position: relative;
  }
  .q-card.answered-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .q-card.answered-wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .q-card.skipped {
    border-color: #888;
    opacity: 0.7;
  }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 0.97rem;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 16px;
    font-weight: 600;
  }

  /* ── OPTIONS ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 11px 14px;
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
  }
  .opt-btn .opt-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold);
    min-width: 18px;
    padding-top: 1px;
  }
  .opt-btn.selected {
    border-color: #5b9bd5;
    background: rgba(91,155,213,0.15);
  }
  .opt-btn.correct {
    border-color: var(--correct) !important;
    background: rgba(46,204,113,0.18) !important;
    color: #a8f0c0;
  }
  .opt-btn.wrong {
    border-color: var(--wrong) !important;
    background: rgba(231,76,60,0.18) !important;
    color: #f0b0a8;
  }
  .opt-btn.reveal-correct {
    border-color: var(--correct) !important;
    background: rgba(46,204,113,0.08) !important;
  }
  .opt-btn:disabled {
    cursor: default;
  }

  /* ── FEEDBACK BADGE ── */
  .feedback {
    display: none;
    margin-top: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: 'Space Mono', monospace;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: rgba(46,204,113,0.15); color: #5ee89e; }
  .feedback.wrong   { background: rgba(231,76,60,0.15);  color: #f08080; }

  /* ── RESULT BADGE ── */
  .result-icon {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 1.2rem;
  }

  /* ── SCOREBOARD ── */
  #scoreboard {
    background: var(--surface);
    border: 2px solid var(--gold);
    border-radius: var(--radius);
    padding: 28px 28px;
    margin-bottom: 30px;
    text-align: center;
    display: none;
  }
  #scoreboard h2 {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 10px;
  }
  #scoreboard .score-big {
    font-family: 'Space Mono', monospace;
    font-size: 3rem;
    color: var(--text);
    margin: 6px 0;
  }
  #scoreboard .score-sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .score-grid {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .score-item { text-align: center; }
  .score-item .val {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
  }
  .score-item .lbl {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .val.green { color: var(--correct); }
  .val.red   { color: var(--wrong); }
  .val.grey  { color: var(--text-muted); }

  /* ── EMPTY / LOADING ── */
  #empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
  }

  @media (max-width: 540px) {
    .q-card { padding: 16px 14px; }
    .opt-btn { font-size: 0.84rem; padding: 10px 11px; }
    header h1 { font-size: 1rem; }
  }
</style>
</head>
